name: Deploy to Excalibase
on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency: deploy-examples
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: site/Dockerfile
          push: true
          tags: excalibase/examples-site:main,excalibase/examples-site:${{ github.sha }}
      - uses: excalibase/deploy-action@v1
        with:
          app: proj-jfp7kx46kb/1144539e-ec14-4c36-806a-63506fdc6304
          image: excalibase/examples-site@${{ steps.build.outputs.digest }}
          token: ${{ secrets.EXCALIBASE_TOKEN }}
